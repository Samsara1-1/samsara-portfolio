name: Daily GitHub Trending

on:
  schedule:
    - cron: '0 1 * * *'   # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-trending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch trending repos
        id: fetch
        run: |
          set -euo pipefail
          # GitHub Search API: 公开仓库按 star 数排序，最近30天有 push（活跃度筛选）
          # 免认证限额：每 IP 10 req/min —— 只请求 2 次足够
          TODAY=$(date -u +%Y-%m-%d)
          WEEK_AGO=$(date -u -d "30 days ago" +%Y-%m-%d)

          RESPONSE=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/repositories?q=stars:%3E1000+pushed:%3E${WEEK_AGO}&sort=stars&order=desc&per_page=20")

          # 用 jq 提取并存为 JSON
          echo "$RESPONSE" | jq '{
            fetched_at: (now | todate),
            repos: [.items[] | {
              full_name,
              name: .name,
              owner: .owner.login,
              description: (.description // "暂无描述"),
              stars: .stargazers_count,
              language: (.language // "N/A"),
              url: .html_url,
              topics: (.topics // [] | .[0:3])
            }]
          }' > data/trending.json

          echo "repos=$(echo "$RESPONSE" | jq '.items | length')" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: diff
        run: |
          git add data/trending.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update trending repos $(date -u +%Y-%m-%d)"
          git push
